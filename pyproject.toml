[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-modernization"
version = "0.1.0"
description = "Deterministic Tree-sitter source extractor for the Polaris modernization POC"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-html==0.23.2",
  "tree-sitter-javascript==0.25.0",
  "PyYAML>=6.0,<7.0",
  "neo4j>=5.0,<6.0",
  "langchain-core>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
azure-openai = ["langchain-openai>=0.3,<1.0"]
openai = ["langchain-openai>=0.3,<1.0"]
bedrock = ["langchain-aws>=0.2,<1.0"]

[project.scripts]
polaris-modernization = "polaris_modernization.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
